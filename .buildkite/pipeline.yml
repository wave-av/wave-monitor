# ci-smoke convention, kept: fpc-isolated agents run with no-command-eval, so  # guard:allow BK pipeline keyword, not a repo reference
# every step's command is exactly one checked-in script path, no arguments.
# Retry follows the wave-ci invariant (templates/_lib/step.mjs): automatic  # guard:allow test invariant and image name
# retry on agent loss only, explicit manual block. Pipeline-level timeouts are
# dropped by Buildkite, so each step carries its own.
#
# Host-side requirements (NOT expressible in this file — see README.md
# "Buildkite runbook"): host-injected values by step key on queue
# fpc-isolated-secrets, fork builds never trigger on venue pipelines
# (build_pull_request_forks=false — there is NO base-revision checkout,
# WAVE-27333), injection withheld for fork builds
# (+ approval-gated trusted re-runs), and
# "Cancel intermediate builds" in the pipeline settings (the GHA
# concurrency/cancel-in-progress equivalent).
# Retry policy is defined once as &retry-agent-loss on the first step and
# reused via *retry-agent-loss so steps cannot drift apart.
#
# Ordering is load-bearing (WAVE-26506): after the three UNGATED R2 absence
# probes (report mode, soft_fail — they must run even when guards fail, and
# the fork-refusing content-policy guard would otherwise shadow them on
# exactly the fork builds they watch), the two leak guards come next, each
# followed by a `wait` barrier, so every secret-bearing step (queue
# fpc-isolated-secrets) topologically depends on BOTH guards — positions
# alone gate nothing. Probes bear no secrets (zero injection, self-verified)
# and are exempt from the guard-gating checks (PROMOTION.md P4). Do not
# remove a barrier or move a secrets step above one without updating
# .buildkite/tests/pipeline-gating.py.
#
# R2 absence probes (WAVE-26519, epic WAVE-26503) — REPORT MODE (2026-10-20):
# the three probe-* steps run on every build soft-failing FLAG (exit 1) only, so
# a FLAG annotates but never breaks the build while internal errors (exit 2)
# still fail it. Promotion to build-failing follows the dated plan in
# .buildkite/absence-probes-PROMOTION.md; the flip is deleting the three
# `soft_fail` blocks once its gates hold.
#
# Host requirements for the probe steps (see README.md "Absence probes"
# runbook — NOT expressible in this file):
#   - ZERO INJECTION: the host maps no injected values to any probe-* step
#     key, on any queue, on any build. probe-absence-env self-verifies this.
#   - NO FORK BUILDS: fork builds never trigger on venue pipelines
#     (build_pull_request_forks=false, API-verified) — there is NO
#     base-revision checkout in the host (WAVE-27333). A fork cannot
#     neuter the detectors it is observed by. R1 fixture (b)/(c) proves
#     the fork-trust dependency shape.
#   - probe-absence-env runs on fpc-isolated-secrets DELIBERATELY: that is the
#     queue where injection happens, so it is the only queue where asserting
#     absence is non-vacuous. It is NOT a secret-bearing step (it receives
#     nothing) and must run UNGATED — see PROMOTION.md P4 for the gating.py
#     probe-key exemption this needs on the stacked pipeline.
steps:
  - label: ":lock: probe absence-env (report mode)"
    key: probe-absence-env
    command: .buildkite/scripts/probe-absence-env.mjs
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated-secrets
    timeout_in_minutes: 5
    soft_fail:
      - exit_status: 1
    retry: &retry-agent-loss
      automatic:
        - exit_status: -1
          limit: 1
        - signal_reason: agent_stop
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - label: ":mag: probe absence-fs (report mode)"
    key: probe-absence-fs
    command: .buildkite/scripts/probe-absence-fs.mjs
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 10
    soft_fail:
      - exit_status: 1
    retry: *retry-agent-loss

  - label: ":scroll: probe absence-log (report mode)"
    key: probe-absence-log
    command: .buildkite/scripts/probe-absence-log.mjs
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 10
    soft_fail:
      - exit_status: 1
    retry: *retry-agent-loss

  - label: ":key: guard gitleaks"
    key: guard-gitleaks
    command: .buildkite/scripts/guard-gitleaks.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 10
    retry: *retry-agent-loss

  - wait

  - label: ":clipboard: guard content-policy"
    key: guard-content-policy
    command: .buildkite/scripts/guard-content-policy.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated-secrets
    timeout_in_minutes: 10
    retry: *retry-agent-loss

  - wait

  - label: ":test_tube: typecheck + lint + unit tests"
    key: node-gates
    command: .buildkite/scripts/ci.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 15
    retry: *retry-agent-loss

  - label: ":mag: foundation secret-scan"
    key: foundation-secret-scan
    command: .buildkite/scripts/foundation-secret-scan.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 10
    retry: *retry-agent-loss

  - label: ":straight_ruler: foundation file-size gate"
    key: foundation-file-size
    command: .buildkite/scripts/foundation-file-size.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 10
    retry: *retry-agent-loss

  - label: ":scroll: foundation skill-validate"
    key: foundation-skill-validate
    command: .buildkite/scripts/foundation-skill-validate.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 5
    retry: *retry-agent-loss

  - label: ":globe_with_meridians: foundation verify-routes"
    key: foundation-verify-routes
    command: .buildkite/scripts/foundation-verify-routes.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 5
    retry: *retry-agent-loss

  - label: ":shield: governance A_BLOCK enforce"
    key: governance-enforce
    command: .buildkite/scripts/governance-enforce.sh
    if: build.pull_request.id != null
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated-secrets
    timeout_in_minutes: 10
    retry: *retry-agent-loss

  - wait

  # O1 (WAVE-26520): provenance-emit runs last behind its own barrier so the
  # manifest's exit-0 claims hold (every prior step passed). Queue
  # fpc-isolated: this step receives NO secrets, names only.
  - label: ":scroll: provenance emit (O1)"
    key: provenance-emit
    command: .buildkite/scripts/provenance-emit.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 5
    retry: *retry-agent-loss
